<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignIn Page</title>
    <script src="https://kit.fontawesome.com/ed73c55eb5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        

        <h1>Sign Up</h1>
        <div class="awsome">
        <i class="fa-brands fa-instagram"  awsome></i>
        <i class="fa-brands fa-github"  awsome></i>
        <i class="fa-brands fa-linkedin"  awsome></i>
        <i class="fa-brands fa-twitter"  awsome></i> 
        </div>
        
        <form action="/signup" method="POST"></form>
        
        <div class="input_box">
            <label><i class="fa-regular fa-user"></i></label>
            <input type="text" name="name" placeholder="Username">
        </div>

        <div class="input_box">
            <label><i class="fa-regular fa-envelope"></i></label>
            <input type="email" name="email" placeholder="Email">
        </div>
        <div class="input_box">
            <label><i class="fa-solid fa-lock"></i></label>
            <input type="password" name="password" placeholder="Password">
        </div>


        <div class="term">
        <input type="checkbox" >I accept term
        </div>
        
        <button> SignUp</button>
        </form>
    </div>
    
</body>
</html>
